<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crónicas · Rol online</title>
<style>
:root{--bg:#000;--p:#0b0b0b;--c:#141414;--bd:#262626;--tx:#ececec;--mu:#8d8d8d;--ac:#d4a24c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--c);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.on,button.pri{background:var(--ac);color:#000;border-color:var(--ac);font-weight:600}
input,textarea,select{width:100%;padding:8px 10px;background:var(--p);border:1px solid var(--bd);border-radius:8px}
label{display:block;margin-top:10px;font-size:13px;color:var(--mu)}
.mu{color:var(--mu)}.sm{font-size:13px}
.box{max-width:420px;margin:8vh auto;padding:22px;background:var(--p);border:1px solid var(--bd);border-radius:14px;width:calc(100% - 28px)}
.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{flex:1}
.top{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--p)}
.top input{flex:1;min-width:0}.logo{white-space:nowrap}.lg{background:none;border:0;font-weight:700;font-size:15px;padding:4px 6px}.lg:hover{color:var(--ac)}
.av{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#000;align-items:center;justify-content:center;font-weight:700;margin-right:6px}
.body{flex:1;display:flex;min-height:0;position:relative}
aside{width:260px;flex:none;border-right:1px solid var(--bd);overflow:auto;padding:12px;background:var(--p)}
aside h4{margin:14px 0 6px;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.08em}aside h4:first-child{margin-top:0}
.it{display:block;width:100%;text-align:left;margin-bottom:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it.cur{border-color:var(--ac)}
#main{flex:1;min-width:0;overflow:auto;padding:16px;display:flex;flex-direction:column}
.empty{margin:auto;text-align:center;color:var(--mu);max-width:340px}
.chh{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--bd)}
#msgs{flex:1;overflow:auto;padding:10px 0}
.m{font-size:var(--fs,15px);max-width:85%;margin:8px 0;padding:8px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--cb,var(--c));color:var(--cbt,inherit)}
.m.u{margin-left:auto;background:var(--ub,#2a2112);color:var(--ubt,inherit);border:1px solid var(--ubd,#4a3a1c)}
.m b{display:block;font-size:12px;color:var(--ac)}
.cmp{display:flex;gap:8px;align-items:flex-end}.cmp textarea{resize:none}.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.m .mn summary{padding:0 8px;border:0;background:none;font-size:18px;line-height:1;opacity:.7}.m .mi{color:var(--tx)}.sr{display:flex;gap:4px;align-items:flex-start;margin-bottom:5px}.sr .it{flex:1;min-width:0;margin-bottom:0}.sr .mn summary{padding:4px 9px;font-size:16px}.fb{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.fb button.on{background:var(--ac);color:#000;border-color:var(--ac);font-weight:700}.fb button{padding:2px 8px;font-size:13px}.m textarea{width:100%;min-width:220px;color:var(--tx)}
.card{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px;max-width:560px}
#mb{display:none}.hb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.hb input{width:180px}.sa{width:20px;height:20px;border-radius:5px;object-fit:cover;vertical-align:middle;margin-right:6px}.ph{width:150px;height:150px;flex:none;border:1px dashed var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--p);color:var(--mu);font-size:13px}.ph img{width:100%;height:100%;object-fit:cover}.ch-av{float:left;width:40px;height:40px;border-radius:10px;object-fit:cover;margin-right:10px}.mn{position:relative}.mn summary{cursor:pointer;list-style:none;background:var(--c);border:1px solid var(--bd);border-radius:8px;padding:6px 11px}.mn summary::-webkit-details-marker{display:none}.mn[open] .mi{position:absolute;right:0;top:calc(100% + 4px);z-index:6;background:var(--p);border:1px solid var(--bd);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:180px}.mn .mi button{text-align:left;border:0;background:none}.mn .mi button:hover{background:var(--c)}
@media(max-width:760px){#mb{display:inline-block}aside{position:absolute;z-index:5;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s}body.sb aside{transform:none}#pn{display:none}}
@media(max-width:760px){.top{flex-wrap:wrap;gap:6px}.top nav{order:8;flex:1 1 100%;display:flex;gap:4px}.top nav button{white-space:nowrap;padding:5px 8px;font-size:13px}.top input#q{order:9;flex:1 1 50%;min-width:0}#fm{order:10}#pm{order:3;margin-left:auto}#pm summary,#fm summary{white-space:nowrap}}
</style></head><body>
<div id="app"></div>
<script>
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let set={fs:'n',ty:1},par={on:0,pin:''},parOK=0,db,user,sample,me,uid,prof,view='chat',cur=null,chars={},metas={},msgs=[],msub=null,q='',busy=false,subs=[];
const col=()=>'data/users/'+uid,mp=id=>col()+'/h_'+id+'/m';
const MAXM=2000;

let LOCAL=false;
/* Guardado local: si la página se abre fuera de claude.ai no hay base de datos, así que se guarda en este navegador */
function mkLocalDb(){
  const KEY='cr_local_db';let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){throw{code:'quota_exceeded',message:'Almacenamiento del navegador lleno'}}};
  const ls=new Set(),fire=()=>ls.forEach(f=>{try{f()}catch(e){}});
  const rows=(p,o,l)=>{const r=Object.keys(st).filter(k=>k.startsWith(p+'/')&&!k.slice(p.length+1).includes('/')).map(k=>({id:k.slice(p.length+1),exists:true,data:()=>JSON.parse(JSON.stringify(st[k]))}));
    if(o)r.sort((a,b)=>{const x=a.data()[o[0]],y=b.data()[o[0]];return(x>y?1:x<y?-1:0)*(o[1]=='desc'?-1:1)});return r.slice(0,l)};
  const doc=p=>({id:p.split('/').pop(),path:p,
    async get(){const e=p in st;return{id:p.split('/').pop(),exists:e,data:()=>e?JSON.parse(JSON.stringify(st[p])):undefined}},
    async set(d){st[p]=JSON.parse(JSON.stringify(d));persist();fire()},
    async update(d){if(!(p in st))throw{code:'invalid_argument',message:'El documento no existe'};Object.assign(st[p],JSON.parse(JSON.stringify(d)));persist();fire()},
    async delete(){delete st[p];persist();fire()}});
  const collection=p=>{let o=null,l=1000;const q={orderBy(f,d){o=[f,d||'asc'];return q},limit(n){l=n;return q},async get(){return{docs:rows(p,o,l)}},
    onSnapshot(cb){const f=()=>cb({docs:rows(p,o,l)});ls.add(f);setTimeout(f,0);return()=>ls.delete(f)},
    async add(d){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);await doc(p+'/'+id).set(d);return doc(p+'/'+id)}};return q};
  return{doc,collection};
}
/* Reintentos y mensajes claros cuando falla un guardado */
const ERR={invalid_argument:'No se pudo guardar: tu acceso no permite escribir (hace falta permiso de Colaborador) o los datos no son válidos.',quota_exceeded:'No se pudo guardar: el almacenamiento está lleno. Borra mensajes o personajes y vuelve a intentarlo.',resource_exhausted:'Demasiadas operaciones seguidas. Espera unos segundos e inténtalo de nuevo.',unavailable:'Sin conexión con la base de datos. Inténtalo de nuevo.'};
async function retry(f){for(let i=0;;i++){try{return await f()}catch(e){const c=e&&e.code;
  if(i<2&&(c=='unavailable'||c=='resource_exhausted')){await new Promise(r=>setTimeout(r,400*(i+1)+Math.random()*400));continue}
  if(c&&ERR[c]){try{e.message=ERR[c]}catch(x){}toast(ERR[c])}throw e}}}
function wrapDb(d){
  const wd=r=>({id:r.id,path:r.path,get:()=>retry(()=>r.get()),set:x=>retry(()=>r.set(x)),update:x=>retry(()=>r.update(x)),delete:()=>retry(()=>r.delete())});
  const wc=q=>({orderBy:(...a)=>wc(q.orderBy(...a)),limit:n=>wc(q.limit(n)),get:()=>retry(()=>q.get()),onSnapshot:(...a)=>q.onSnapshot(...a),add:x=>retry(()=>q.add(x))});
  return{doc:p=>wd(d.doc(p)),collection:p=>wc(d.collection(p))};
}
async function delAll(refs){for(let i=0;i<refs.length;i+=6)await Promise.all(refs.slice(i,i+6).map(r=>r.delete()))}
function backupHTML(){return `<div class="card"><b>Copia de seguridad</b><p class="mu sm">Para llevar tus personajes y chats a otro dispositivo: pulsa «Exportar», copia el texto y, en el otro dispositivo, pégalo aquí y pulsa «Importar».</p>
 <div class="hb"><button onclick="bkExport()">Exportar</button><button onclick="bkCopy()">Copiar</button></div>
 <textarea id="bk" rows="5" placeholder="Aquí aparece la copia. Para importar, pega aquí el texto." style="margin-top:8px"></textarea>
 <div class="hb" style="margin-top:8px"><button class="pri" onclick="bkImport()">Importar</button></div></div>`}
async function bkExport(){
  const b=$('bk');b.value='Preparando…';
  try{const out={},s=await db.collection(col()).get();
   for(const d of s.docs){if(d.id=='probe')continue;out[d.id]=d.data();if(d.id.startsWith('h_')){const id=d.id.slice(2),m=await db.collection(mp(id)).get();out['m/'+id]=m.docs.map(x=>({k:x.id,d:x.data()}))}}
   b.value=JSON.stringify({app:'cronicas',v:1,docs:out});toast('Copia lista. Pulsa «Copiar».')}
  catch(e){b.value='';toast('No se pudo exportar la copia.')}
}
async function bkCopy(){const b=$('bk');if(!b.value)return;try{await navigator.clipboard.writeText(b.value);toast('Copiado')}catch(e){b.select();try{document.execCommand('copy');toast('Copiado')}catch(e2){toast('Selecciona el texto y cópialo a mano.')}}}
async function bkImport(){
  let j;try{j=JSON.parse($('bk').value)}catch(e){return toast('El texto no es una copia válida.')}
  if(!j||j.app!=='cronicas'||!j.docs)return toast('El texto no es una copia de Crónicas.');
  const ok=k=>typeof k=='string'&&/^[A-Za-z0-9_\-.~:@+]+$/.test(k);let n=0;
  try{for(const [k,v] of Object.entries(j.docs)){
    if(k.startsWith('m/')){const id=k.slice(2);if(!ok(id)||!Array.isArray(v))continue;for(const x of v){if(ok(x.k)&&x.d&&typeof x.d=='object'){await db.doc(mp(id)+'/'+x.k).set(x.d);n++}}}
    else if(ok(k)&&v&&typeof v=='object'){await db.doc(col()+'/'+k).set(v);n++}}}
  catch(e){return toast('Importación incompleta: '+((e&&e.message)||e))}
  try{const a=await db.doc(col()+'/profile').get();if(a.exists)prof=a.data();const b=await db.doc(col()+'/settings').get();if(b.exists)set={...set,...b.data()};const c=await db.doc(col()+'/parental').get();if(c.exists)par={...par,...c.data()}}catch(e){}
  applySet();toast('Importados '+n+' elementos.');
}
async function init(){
  try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
  try{sample=await claude.use('sample')}catch(e){}
  if(db&&user){try{me=await user.me();uid=me.id}catch(e){}}
  if(!uid){LOCAL=true;db=mkLocalDb();me={id:'local',name:''};uid='local';sample=null}
  db=wrapDb(db);
  if(!LOCAL){let can=true;try{const c=await user.can('data.write');if(c===false)can=false;else if(c===null){try{await db.doc(col()+'/probe').set({t:1});await db.doc(col()+'/probe').delete()}catch(e){if(e&&e.code=='invalid_argument')can=false}}}catch(e){}
    if(!can){LOCAL=true;db=wrapDb(mkLocalDb());me={id:'local',name:(me&&me.name)||''};uid='local';toast('Aquí no tienes permiso de escritura en la base de datos de claude.ai: tus datos se guardarán en este navegador (modo local).')}}
  try{const s=await db.doc(col()+'/profile').get();prof=s.exists?s.data():null}catch(e){prof=null}
  try{const a=await db.doc(col()+'/settings').get();if(a.exists)set={...set,...a.data()};const b=await db.doc(col()+'/parental').get();if(b.exists)par={...par,...b.data()}}catch(e){}
  try{const l=await db.doc(col()+'/lastchat').get();if(l.exists)lastId=l.data().id}catch(e){}
  try{const dr=await db.doc(col()+'/draft').get();if(dr.exists)draft=dr.data()}catch(e){}
  let ok=false;try{ok=localStorage.getItem('cr_ok')==uid}catch(e){}
  if(ok&&prof)enter();else auth('in');
}
function savedEmail(){try{return localStorage.getItem('cr_email')||(prof&&prof.email)||''}catch(e){return(prof&&prof.email)||''}}
function remember(e){try{localStorage.setItem('cr_ok',uid);localStorage.setItem('cr_email',e)}catch(x){}}
function login(){const e=$('le').value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))return markReq('le');
  if(!prof){alert('No hay ninguna cuenta con ese e-mail. Regístrate primero.');return auth('up')}
  if(!prof.email){alert('Tu perfil no tiene e-mail. Pulsa «Registrarte» para añadirlo.');return auth('up')}
  if(prof.email.toLowerCase()!==e){markReq('le');return alert('Ese e-mail no coincide con el de tu cuenta.')}
  remember(e);enter()}
function auth(m){
  app.innerHTML=`<div class="box"><h2>🐉 Crónicas</h2><p class="mu">Crea personajes, habla con ellos y retoma tus historias cuando quieras.</p>
  <div class="tabs"><button class="${m=='in'?'on':''}" onclick="auth('in')">Iniciar sesión</button><button class="${m=='up'?'on':''}" onclick="auth('up')">Registrarte</button></div>
  ${m=='in'?`<label>E-mail</label><input id="le" type="email" maxlength="80" placeholder="nombre@correo.com" value="${esc(savedEmail())}" onkeydown="if(event.key=='Enter')login()"><button class="pri" style="margin-top:12px" onclick="login()">Iniciar sesión</button><p class="mu sm">Usa el e-mail con el que te registraste. Si aún no tienes cuenta, pulsa «Registrarte».</p>`
  :`${profFields(prof,me)}<button class="pri" style="margin-top:12px" onclick="reg()">${prof?'Actualizar y entrar':'Crear cuenta'}</button>`}
  <p class="mu sm">${LOCAL?'Modo local: tus datos se guardan solo en este navegador. Para llevarlos a otro dispositivo usa Ajustes → Copia de seguridad.':'Tu identidad es tu cuenta de claude.ai; no se guardan contraseñas.'}</p></div>`;
}
async function reg(){
  const x=pdata();if(!x)return;
  const d={...x,createdAt:prof?prof.createdAt:Date.now()},first=!prof;
  try{await db.doc(col()+'/profile').set(d);prof=d;if(first&&d.age<18){par={...par,on:1};try{await db.doc(col()+'/parental').set(par)}catch(e2){}}remember(d.email.toLowerCase());enter()}catch(e){alert('No se pudo guardar el registro: '+((e&&e.message)||e))}
}
function enter(){
  app.innerHTML=`<div class="top"><button id="mb" onclick="document.body.classList.toggle('sb')">☰</button><button class="logo lg" title="Ir al inicio" onclick="goHome()">🐉 Crónicas</button>${LOCAL?'<span class="mu sm" title="Los datos se guardan solo en este navegador">modo local</span>':''}
   <nav><button id="n-chat" onclick="show('chat')">Chat</button> <button id="n-new" onclick="show('new')">＋ Personaje</button> <button id="n-com" onclick="show('com')">🌐 Comunidad</button></nav>
   <input id="q" placeholder="Buscar personajes y chats…" oninput="q=this.value;renderSide()">
   <details class="mn" id="fm"><summary id="fs">Filtro</summary><div class="mi" style="padding:10px;min-width:230px"><label style="margin-top:0">Género</label><select id="fg" onchange="fg=this.value;renderSide()"><option value="">Todos</option>${['Masculino','Femenino','No binario','Otro'].map(x=>`<option ${fg==x?'selected':''}>${x}</option>`).join('')}</select><label>Mundo (Fantástico)</label><select id="fw" onchange="fw=this.value;$('fwt').style.display=fw=='Otro'?'':'none';renderSide()"><option value="">Todos</option>${WORLDS.map(x=>`<option ${fw==x?'selected':''}>${x}</option>`).join('')}<option ${fw=='Otro'?'selected':''}>Otro</option></select><input id="fwt" placeholder="Escribe el mundo…" value="${esc(fwt)}" style="margin-top:6px;${fw=='Otro'?'':'display:none'}" oninput="fwt=this.value.trim().toLowerCase();renderSide()"><button style="margin-top:8px" onclick="clearF()">Limpiar filtros</button></div></details>
   <details class="mn" id="pm"><summary><span class="av">${esc((prof.alias||'?')[0].toUpperCase())}</span><span id="pn">${esc(prof.alias)}</span> ▾</summary><div class="mi"><button onclick="pmenu('me')">Editar perfil</button><button onclick="pmenu('chars')">Personajes</button><button onclick="pmenu('set')">Ajustes</button><button onclick="pmenu('out')">Cerrar sesión</button><button onclick="pmenu('del')">Eliminar cuenta</button><button onclick="pmenu('par')">Control parental</button></div></details></div>
   <div class="body"><aside><h4>Personajes</h4><div id="sv"></div></aside><section id="main"></section></div>`;
  subs.forEach(u=>u());subs=[];
  try{subs.push(db.collection('pub').onSnapshot(s=>{pubs={};s.docs.forEach(d=>{pubs[d.id]=d.data()});if(view=='com')renderCom();if(view=='new'&&nt=='mine')show('new')}))}catch(e){}
  subs.push(db.collection(col()).onSnapshot(s=>{chars={};metas={};s.docs.forEach(d=>{const k=d.id,x=d.data();if(k.startsWith('p_'))chars[k.slice(2)]=x;else if(k.startsWith('h_'))metas[k.slice(2)]=x});renderSide();if(!opened&&lastId&&chars[lastId]){opened=1;if(!cur)openChat(lastId)}}));
  show('chat');
}
function logout(){try{localStorage.removeItem('cr_ok')}catch(e){}parOK=0;subs.forEach(u=>u());subs=[];if(msub)msub();msub=null;cur=null;msgs=[];q='';auth('in')}
function show(v){
  view=v;document.body.classList.remove('sb');applySet();
  $('n-chat').className=v=='chat'?'on':'';$('n-new').className=v=='new'?'on':'';$('n-com').className=v=='com'?'on':'';
  const m=$('main');
  if(v=='chat')renderChat();
  if(v=='new')m.innerHTML=newHead()+(nt=='rec'?recHTML():nt=='mine'?mineHTML():`<div class="card">
   ${photoBox('')}<label>Nombre *</label><input id="cn" maxlength="60"><label>Género</label>${genSel('')}<label>Rol *</label>${pick('cc',ROLES,'','Escribe el rol…','Elige un rol…')}
   <label>Instrucciones (opcional)</label><textarea id="cd" oninput="autoSave()" rows="6" maxlength="2000" placeholder="Personalidad, historia, cómo habla, qué quiere…">${esc(draft.desc)}</textarea>
   <label>Mundo *</label>${worldSel('')}${extras(draft)}
   <button class="pri" style="margin-top:12px" onclick="newChar()">Crear y empezar a hablar</button></div>`);
  if(v=='com')renderCom();
  if(v=='me')m.innerHTML=`<h2 style="margin:0 0 10px">Editar perfil</h2><div class="card">${profFields(prof)}
   <button class="pri" style="margin-top:10px" onclick="saveProf()">Guardar</button></div>
   <p class="mu">${Object.keys(chars).length} personajes · ${Object.keys(metas).length} conversaciones · miembro desde ${new Date(prof.createdAt).toLocaleDateString('es-ES')}</p><button onclick="logout()">Cerrar sesión</button>`;
}
function renderSide(){
  if(view=='com')renderCom();const sv=$('sv');if(!sv)return;const nf=(fg?1:0)+(fw?1:0),fb=$('fs');if(fb)fb.textContent='Filtro'+(nf?' ('+nf+')':'');const s=q.trim().toLowerCase();
  const pin=i=>chars[i]&&chars[i].pinned?1:0,arc=i=>chars[i]&&chars[i].archived;
  const ca=Object.entries(chars).filter(([i,c])=>!c.archived&&fok(c)&&(!s||(c.name+' '+c.cls+' '+c.uni).toLowerCase().includes(s))).sort((a,b)=>(pin(b[0])-pin(a[0]))||b[1].createdAt-a[1].createdAt);
  
  
  
  const ar=Object.entries(chars).filter(([i,c])=>c.archived&&fok(c)&&(!s||(c.name+' '+c.cls+' '+c.uni).toLowerCase().includes(s)));
  sv.innerHTML=(ca.length?ca.map(([id,c])=>srow(id,c)).join(''):`<p class="mu sm">${s||fg||fw?'Sin resultados.':'Aún no has creado personajes.'}</p>`)+(ar.length?`<details style="margin-top:12px" ${arcOpen?'open':''} ontoggle="arcOpen=this.open"><summary class="mu sm" style="cursor:pointer">Archivados (${ar.length})</summary>${ar.map(([id,c])=>srow(id,c)).join('')}</details>`:'');
  
}
async function newChar0(){
  const name=$('cn').value.trim(),cls0=$('cc').value.trim(),uni0=$('cu').value.trim();
  const bad=[['cn',name],['cc',cls0],['cu',uni0]].find(x=>!x[1]);if(bad){markReq(bad[0]);return}
